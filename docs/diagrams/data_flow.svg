<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">SIMBA-EMS operational data flow</title><desc id="desc">A traceable sequence from meters through validation, databases, forecasting, safety rules, operator approval, control, verification and audit.</desc><defs><style>.bg{fill:#f5f5f7}.box{fill:#fff;stroke:#d2d2d7;stroke-width:2}.blue{fill:#eef6ff;stroke:#0066cc;stroke-width:2}.dark{fill:#1d1d1f;stroke:#1d1d1f;stroke-width:2}.h{font:650 18px Inter,Segoe UI,Arial;fill:#1d1d1f}.hd{font:650 18px Inter,Segoe UI,Arial;fill:#fff}.t{font:13px Inter,Segoe UI,Arial;fill:#606066}.td{font:13px Inter,Segoe UI,Arial;fill:#d2d2d7}.n{font:700 12px Inter,Segoe UI,Arial;fill:#0066cc}.a{stroke:#0066cc;stroke-width:3;fill:none;marker-end:url(#m)}.feedback{stroke:#6e6e73;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#m2)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0066cc"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs><rect class="bg" width="1400" height="620"/><text class="h" x="45" y="45">SIMBA-EMS traceable operational data flow</text>
<g transform="translate(45 95)"><rect class="box" width="190" height="125" rx="18"/><text class="n" x="18" y="28">1 · ACQUIRE</text><text class="h" x="18" y="60">Meter reading</text><text class="t" x="18" y="88">kVA · kW · kVAR · PF</text><text class="t" x="18" y="109">timestamp + facility ID</text></g>
<g transform="translate(275 95)"><rect class="box" width="190" height="125" rx="18"/><text class="n" x="18" y="28">2 · VALIDATE</text><text class="h" x="18" y="60">Edge checks</text><text class="t" x="18" y="88">schema · range · duplicate</text><text class="t" x="18" y="109">buffer and retry</text></g>
<g transform="translate(505 95)"><rect class="blue" width="190" height="125" rx="18"/><text class="n" x="18" y="28">3 · PERSIST</text><text class="h" x="18" y="60">Time-series DB</text><text class="t" x="18" y="88">clean value + quality flag</text><text class="t" x="18" y="109">immutable ingestion ID</text></g>
<g transform="translate(735 95)"><rect class="dark" width="190" height="125" rx="18"/><text class="n" x="18" y="28">4 · FORECAST</text><text class="hd" x="18" y="60">AI model route</text><text class="td" x="18" y="88">30 min · 2 h · 6 h · 24 h</text><text class="td" x="18" y="109">point + upper bound</text></g>
<g transform="translate(965 95)"><rect class="blue" width="190" height="125" rx="18"/><text class="n" x="18" y="28">5 · CONSTRAIN</text><text class="h" x="18" y="60">Safety rules</text><text class="t" x="18" y="88">critical-load exclusion</text><text class="t" x="18" y="109">safe reduction limit</text></g>
<g transform="translate(1195 95)"><rect class="box" width="160" height="125" rx="18"/><text class="n" x="18" y="28">6 · ALERT</text><text class="h" x="18" y="60">Action queue</text><text class="t" x="18" y="88">dynamic priority</text><text class="t" x="18" y="109">Gmail attention</text></g>
<path class="a" d="M235 157H275"/><path class="a" d="M465 157H505"/><path class="a" d="M695 157H735"/><path class="a" d="M925 157H965"/><path class="a" d="M1155 157H1195"/>
<g transform="translate(105 350)"><rect class="box" width="230" height="135" rx="18"/><text class="n" x="20" y="30">10 · AUDIT</text><text class="h" x="20" y="65">Evidence database</text><text class="t" x="20" y="94">forecast · rule · decision</text><text class="t" x="20" y="116">command · outcome · model</text></g>
<g transform="translate(430 350)"><rect class="box" width="230" height="135" rx="18"/><text class="n" x="20" y="30">9 · VERIFY</text><text class="h" x="20" y="65">Impact service</text><text class="t" x="20" y="94">approved saving estimate</text><text class="t" x="20" y="116">measured reduction if active</text></g>
<g transform="translate(755 350)"><rect class="box" width="230" height="135" rx="18"/><text class="n" x="20" y="30">8 · EXECUTE</text><text class="h" x="20" y="65">Control gateway</text><text class="t" x="20" y="94">simulation · dry run · HTTP</text><text class="t" x="20" y="116">acknowledgement + interlock</text></g>
<g transform="translate(1080 350)"><rect class="dark" width="230" height="135" rx="18"/><text class="n" x="20" y="30">7 · AUTHORISE</text><text class="hd" x="20" y="65">Operator approval</text><text class="td" x="20" y="94">authenticated dashboard</text><text class="td" x="20" y="116">idempotent decision record</text></g>
<path class="a" d="M1275 220V290H1195V350"/><path class="a" d="M1080 417H985"/><path class="a" d="M755 417H660"/><path class="a" d="M430 417H335"/><path class="feedback" d="M220 485V555H830V220"/><text class="t" x="470" y="585">Verified outcomes close the loop. Production learning is blocked until offline validation approves a new model version.</text></svg>