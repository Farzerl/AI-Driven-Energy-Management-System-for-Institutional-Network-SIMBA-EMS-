<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">SIMBA-EMS layered system architecture</title><desc id="desc">Eight ordered layers from smart meters and edge gateways through secure data services, forecasting, engineering safety, operator approval, control and audit databases.</desc>
<defs><style>.bg{fill:#f5f5f7}.panel{fill:#fff;stroke:#d2d2d7;stroke-width:2}.dark{fill:#1d1d1f;stroke:#1d1d1f;stroke-width:2}.blue{fill:#eef6ff;stroke:#0066cc;stroke-width:2}.h{font:650 22px Inter,Segoe UI,Arial;fill:#1d1d1f}.hd{font:650 22px Inter,Segoe UI,Arial;fill:#fff}.t{font:14px Inter,Segoe UI,Arial;fill:#5c5c62}.td{font:14px Inter,Segoe UI,Arial;fill:#d2d2d7}.num{font:700 13px Inter,Segoe UI,Arial;fill:#0066cc}.edge{stroke:#0066cc;stroke-width:3;fill:none;marker-end:url(#arrow)}.return{stroke:#6e6e73;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow2)}.db{fill:#fff;stroke:#0066cc;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0066cc"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect class="bg" width="1400" height="920"/><text class="h" x="55" y="55">SIMBA-EMS — production-oriented institutional energy architecture</text><text class="t" x="55" y="82">Local-first, operator-approved and designed for meter, model, control and evidence traceability.</text>
<!-- row 1 -->
<g transform="translate(55 125)"><rect class="panel" width="250" height="150" rx="20"/><text class="num" x="22" y="30">01 · DEVICE</text><text class="h" x="22" y="65">Meters and equipment</text><text class="t" x="22" y="96">kVA · kW · kVAR · PF · kWh</text><text class="t" x="22" y="120">STM32 sensing and breaker state</text></g>
<g transform="translate(380 125)"><rect class="panel" width="250" height="150" rx="20"/><text class="num" x="22" y="30">02 · EDGE</text><text class="h" x="22" y="65">Raspberry Pi gateway</text><text class="t" x="22" y="96">Validate · align · deduplicate</text><text class="t" x="22" y="120">Offline buffer and secure retry</text></g>
<g transform="translate(705 125)"><rect class="blue" width="250" height="150" rx="20"/><text class="num" x="22" y="30">03 · INGESTION</text><text class="h" x="22" y="65">FastAPI boundary</text><text class="t" x="22" y="96">Authenticated meter endpoint</text><text class="t" x="22" y="120">Schema and range validation</text></g>
<g transform="translate(1030 125)"><rect class="panel" width="315" height="150" rx="20"/><text class="num" x="22" y="30">04 · DATA PLATFORM</text><text class="h" x="22" y="65">Operational data services</text><text class="t" x="22" y="96">Time-series store · feature store</text><text class="t" x="22" y="120">Quality flags · facility metadata</text></g>
<path class="edge" d="M305 200H380"/><path class="edge" d="M630 200H705"/><path class="edge" d="M955 200H1030"/>
<!-- databases -->
<g transform="translate(1090 305)"><ellipse class="db" cx="95" cy="18" rx="95" ry="18"/><rect class="db" x="0" y="18" width="190" height="70"/><ellipse class="db" cx="95" cy="88" rx="95" ry="18"/><text class="h" x="95" y="58" text-anchor="middle">Time-series DB</text><text class="t" x="95" y="80" text-anchor="middle">readings + features</text></g>
<!-- row 2 -->
<g transform="translate(55 440)"><rect class="dark" width="300" height="165" rx="20"/><text class="num" x="22" y="30">05 · AI SERVICE</text><text class="hd" x="22" y="67">Forecast and uncertainty</text><text class="td" x="22" y="100">HGB · LSTM · Transformer</text><text class="td" x="22" y="124">Chronos-2 · horizon routing</text><text class="td" x="22" y="148">kVA · kW · kVAR · P50/P90</text></g>
<g transform="translate(425 440)"><rect class="blue" width="300" height="165" rx="20"/><text class="num" x="22" y="30">06 · SAFETY</text><text class="h" x="22" y="67">Risk and engineering rules</text><text class="t" x="22" y="100">Peak and power-factor risk</text><text class="t" x="22" y="124">Critical-load exclusions</text><text class="t" x="22" y="148">Safe controllability limits</text></g>
<g transform="translate(795 440)"><rect class="panel" width="300" height="165" rx="20"/><text class="num" x="22" y="30">07 · HUMAN CONTROL</text><text class="h" x="22" y="67">Operator decision layer</text><text class="t" x="22" y="100">Gmail attention alert</text><text class="t" x="22" y="124">Approval deck + idempotency</text><text class="t" x="22" y="148">Decision and identity record</text></g>
<path class="edge" d="M1185 393V410H205V440"/><path class="edge" d="M355 522H425"/><path class="edge" d="M725 522H795"/>
<!-- row 3 -->
<g transform="translate(170 700)"><rect class="panel" width="330" height="145" rx="20"/><text class="num" x="22" y="30">08A · CONTROL</text><text class="h" x="22" y="65">Execution gateway</text><text class="t" x="22" y="96">Software plant · dry run</text><text class="t" x="22" y="120">Authorised HTTP smart-breaker path</text></g>
<g transform="translate(565 700)"><rect class="panel" width="330" height="145" rx="20"/><text class="num" x="22" y="30">08B · VERIFICATION</text><text class="h" x="22" y="65">Impact and M&amp;V service</text><text class="t" x="22" y="96">Approved-plan cost estimate</text><text class="t" x="22" y="120">Measured reduction when available</text></g>
<g transform="translate(960 700)"><ellipse class="db" cx="150" cy="18" rx="150" ry="18"/><rect class="db" x="0" y="18" width="300" height="90"/><ellipse class="db" cx="150" cy="108" rx="150" ry="18"/><text class="h" x="150" y="58" text-anchor="middle">Audit + evidence DB</text><text class="t" x="150" y="82" text-anchor="middle">commands · decisions · metrics</text><text class="t" x="150" y="103" text-anchor="middle">model registry and validation</text></g>
<path class="edge" d="M945 605V655H335V700"/><path class="edge" d="M500 772H565"/><path class="edge" d="M895 772H960"/><path class="return" d="M1110 845V885H205V845"/>
<text class="t" x="525" y="902">Feedback loop: verified outcomes update evidence; model changes require offline chronological validation before deployment.</text>
</svg>